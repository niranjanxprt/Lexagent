[project]
name = "lexagent"
version = "0.1.0"
description = "Legal Research AI Agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "openai>=1.35.0",
    "tavily-python>=0.3.3",
    "langfuse>=3.0.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort (import sorting)
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "COM",    # flake8-commas
    "C4",     # flake8-comprehensions
    "T10",    # flake8-debugger
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "W191",   # indentation contains tabs
    "COM812", # missing trailing comma (conflicts with formatter)
]
exclude = [".git", "__pycache__", ".venv", ".env", "*.pyc", "build", "dist"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
